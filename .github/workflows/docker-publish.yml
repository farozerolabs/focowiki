name: Publish Stable Docker Images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  attestations: write
  artifact-metadata: write
  id-token: write

concurrency:
  group: docker-stable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish stable images
    uses: ./.github/workflows/docker-build.yml
    with:
      channel: stable
      version: ${{ github.ref_name }}
    secrets: inherit
