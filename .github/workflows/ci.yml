name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      FOCOWIKI_TEST_DATABASE_URL: postgres://focowiki:focowiki@127.0.0.1:55432/focowiki
      FOCOWIKI_STORAGE_VNEXT_TEST_DATABASE_URL: postgres://focowiki:focowiki@127.0.0.1:55432/focowiki
      FOCOWIKI_STORAGE_VNEXT_TEST_REDIS_URL: redis://127.0.0.1:56379/0
      FOCOWIKI_STORAGE_VNEXT_TEST_RUN_OWNER: svnext-ci000001
      FOCOWIKI_TEST_EXTERNAL_S3: "true"
      FOCOWIKI_TEST_EXTERNAL_S3_RUN_OWNER: s3compat-ci000001
      FOCOWIKI_TEST_S3_ENDPOINT: http://127.0.0.1:43301
      FOCOWIKI_TEST_S3_ACCESS_KEY_ID: focowiki-ci
      FOCOWIKI_TEST_S3_SECRET_ACCESS_KEY: focowiki-ci-versioned-secret
      FOCOWIKI_TEST_MEILISEARCH_URL: http://127.0.0.1:57700
      FOCOWIKI_TEST_MEILISEARCH_API_KEY: focowiki-development-master-key
      FOCOWIKI_TEST_OPENSEARCH_URL: http://127.0.0.1:59200
      FOCOWIKI_TEST_OPENSEARCH_VERSION: 3.8.0
      FOCOWIKI_TEST_OPENSEARCH_RUN_OWNER: svnext-ci000001
      REDIS_URL: redis://127.0.0.1:56379/0
      S3_ENDPOINT: http://127.0.0.1:43301
      S3_REGION: us-east-1
      S3_BUCKET: focowiki-ci
      S3_ACCESS_KEY_ID: focowiki-ci
      S3_SECRET_ACCESS_KEY: focowiki-ci-versioned-secret
      S3_PREFIX: validation
      S3_FORCE_PATH_STYLE: "true"

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: focowiki
          POSTGRES_USER: focowiki
          POSTGRES_PASSWORD: focowiki
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U focowiki -d focowiki"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      meilisearch:
        image: getmeili/meilisearch:v1.51.0
        env:
          MEILI_ENV: production
          MEILI_MASTER_KEY: focowiki-development-master-key
          MEILI_NO_ANALYTICS: "true"
          MEILI_EXPERIMENTAL_ENABLE_METRICS: "true"
        ports:
          - 57700:7700
        options: >-
          --health-cmd "curl --fail --silent http://127.0.0.1:7700/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      opensearch:
        image: opensearchproject/opensearch:3.8.0
        env:
          "discovery.type": single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 59200:9200
        options: >-
          --health-cmd "curl --fail --silent http://127.0.0.1:9200/"
          --health-start-period 30s
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.7.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm security:audit

      - name: Validate production Compose template
        run: |
          cp .env.example .env
          pnpm compose:example:config

      - name: Validate Docker development Compose template
        run: |
          cp .env.dev.example .env
          pnpm compose:dev:example:config

      - name: Validate local full-stack Compose template
        run: |
          cp .env.dev.example .env
          pnpm compose:local:example:config

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build API Docker image
        run: |
          docker build --target api --build-arg FOCOWIKI_RELEASE_VERSION=0.0.0-ci -t focowiki-api:ci .
          docker image inspect focowiki-api:ci --format '{{json .Config.Env}}' | grep 'FOCOWIKI_RELEASE_VERSION=0.0.0-ci'

      - name: Validate API image indexing runtimes
        run: |
          docker run --rm --entrypoint python focowiki-api:ci --version
          docker run --rm --entrypoint python focowiki-api:ci -m graphrag_adapter_check
          docker run --rm --entrypoint python focowiki-api:ci -m unittest discover -s apps/api/python/tests -v

      - name: Validate API image search initialization
        shell: bash
        run: |
          security_volume="focowiki-ci-opensearch-security-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          secret_volume="focowiki-ci-search-secrets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "${security_volume}" >/dev/null
          docker volume create "${secret_volume}" >/dev/null
          cleanup() {
            docker volume rm -f "${security_volume}" >/dev/null 2>&1 || true
            docker volume rm -f "${secret_volume}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          search_init=(
            docker run --rm
            --mount "type=volume,source=${security_volume},target=/app/opensearch-security"
            --mount "type=volume,source=${secret_volume},target=/app/runtime-secrets"
            -e SEARCH_PROVIDER=opensearch
            -e SEARCH_INDEX_PREFIX=focowiki_ci
            -e BUNDLED_OPENSEARCH_SECURITY_ENABLED=true
            -e OPENSEARCH_ADMIN_PASSWORD=focowiki-ci-opensearch-admin-password
            -e OPENSEARCH_RUNTIME_USERNAME=focowiki-runtime
            -e OPENSEARCH_SECURITY_DIR=/app/opensearch-security
            -e OPENSEARCH_SECRET_DIR=/app/runtime-secrets
            focowiki-api:ci node apps/api/runtime/search-init.mjs
          )
          first="$("${search_init[@]}")"
          second="$("${search_init[@]}")"
          grep -F '"source":"generated"' <<< "${first}"
          grep -F '"source":"reused"' <<< "${second}"
          cleanup
          trap - EXIT

      - name: Migrate CI database with API image
        run: >-
          docker run --rm --network host --env-file .env.dev.example
          -e DATABASE_URL="${FOCOWIKI_TEST_DATABASE_URL}"
          -e REDIS_URL="${REDIS_URL}"
          focowiki-api:ci node apps/api/runtime/migrate.mjs

      - name: Validate current schema idempotence
        run: |
          docker run --rm --network host --env-file .env.dev.example -e DATABASE_URL="${FOCOWIKI_TEST_DATABASE_URL}" -e REDIS_URL="${REDIS_URL}" focowiki-api:ci node apps/api/runtime/migration-preflight.mjs
          docker run --rm --network host --env-file .env.dev.example -e DATABASE_URL="${FOCOWIKI_TEST_DATABASE_URL}" -e REDIS_URL="${REDIS_URL}" focowiki-api:ci node apps/api/runtime/migrate.mjs

      - name: Validate storage vNext schema contracts
        run: >-
          pnpm --filter @focowiki/api exec vitest run
          test/migration-manifest.test.ts
          test/migrations.test.ts
          test/storage-vnext-bootstrap-reset-contract.test.ts
          test/storage-vnext-bootstrap-reset.integration.test.ts
          test/storage-vnext-schema-constraints-contract.test.ts
          test/storage-vnext-schema-constraints.integration.test.ts

      - name: Start S3 health fixture
        run: |
          node scripts/ci/s3-health-fixture.mjs &
          echo $! > /tmp/focowiki-s3-health-fixture.pid

      - name: Start versioned S3 compatibility fixture
        run: |
          docker run --detach --rm \
            --name focowiki-versioned-s3-ci \
            --publish 127.0.0.1:43301:9000 \
            -e MINIO_ROOT_USER="${S3_ACCESS_KEY_ID}" \
            -e MINIO_ROOT_PASSWORD="${S3_SECRET_ACCESS_KEY}" \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          curl --fail --silent --show-error --retry 30 --retry-delay 2 \
            --retry-all-errors http://127.0.0.1:43301/minio/health/live
          pnpm --filter @focowiki/api exec node --input-type=module --eval '
            import { CreateBucketCommand, S3Client } from "@aws-sdk/client-s3";
            const client = new S3Client({
              endpoint: process.env.S3_ENDPOINT,
              region: process.env.S3_REGION,
              forcePathStyle: true,
              credentials: {
                accessKeyId: process.env.S3_ACCESS_KEY_ID,
                secretAccessKey: process.env.S3_SECRET_ACCESS_KEY
              }
            });
            await client.send(new CreateBucketCommand({ Bucket: process.env.S3_BUCKET }));
            client.destroy();
          '

      - name: Test
        run: pnpm test

      - name: Start maintained OpenSearch 2.19 compatibility fixture
        run: |
          docker run --detach --rm --name focowiki-opensearch-2-19-ci --publish 127.0.0.1:59219:9200 -e "discovery.type=single-node" -e "DISABLE_SECURITY_PLUGIN=true" -e "DISABLE_INSTALL_DEMO_CONFIG=true" -e "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m" opensearchproject/opensearch:2.19.6
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:59219/

      - name: Validate maintained OpenSearch 2.19 compatibility
        env:
          FOCOWIKI_TEST_OPENSEARCH_URL: http://127.0.0.1:59219
          FOCOWIKI_TEST_OPENSEARCH_VERSION: 2.19.6
          FOCOWIKI_TEST_OPENSEARCH_RUN_OWNER: svnext-ci2190001
        run: >-
          pnpm --filter @focowiki/api exec vitest run
          test/opensearch-provider-runtime.integration.test.ts

      - name: Stop maintained OpenSearch 2.19 compatibility fixture
        if: always()
        run: |
          docker rm --force focowiki-opensearch-2-19-ci >/dev/null 2>&1 || true
          docker image rm opensearchproject/opensearch:2.19.6 >/dev/null 2>&1 || true

      - name: Validate storage vNext PostgreSQL plans
        run: >-
          pnpm --filter @focowiki/api exec vitest run
          test/storage-vnext-index.integration.test.ts

      - name: Validate source-to-activation smoke flow
        run: >-
          pnpm --filter @focowiki/api exec vitest run
          test/document-upload-finalization.integration.test.ts
          test/document-retry-lifecycle.integration.test.ts
          test/document-activation-cleanup-lifecycle.integration.test.ts
          test/document-deletion-projection.integration.test.ts
          test/document-semantic-fact-reuse.integration.test.ts

      - name: Test validation scripts
        run: pnpm test:validation

      - name: Build
        run: pnpm build

      - name: Validate Admin production bundle
        run: pnpm validate:admin-build-debug-output

      - name: Validate OpenAPI contract
        run: pnpm openapi:validate

      - name: Validate API Docker runtimes
        run: docker run --rm --entrypoint node focowiki-api:ci -e "const fs=require('node:fs'); for (const file of ['apps/api/runtime/main.mjs','apps/api/runtime/worker.mjs','apps/api/runtime/migrate.mjs','apps/api/runtime/migration-preflight.mjs','apps/api/runtime/search-init.mjs']) fs.accessSync(file);"

      - name: Validate native tokenizer runtime
        run: |
          docker run --rm --entrypoint sh focowiki-api:ci -lc 'test ! -x /usr/bin/g++ && test ! -x /usr/bin/make'
          docker run --rm --entrypoint sh focowiki-api:ci -lc 'test -f apps/api/runtime/node_modules/nodejieba/LICENSE'
          docker run --rm --entrypoint node focowiki-api:ci -e "const jieba=require('./apps/api/runtime/node_modules/nodejieba'); const tokens=jieba.cutForSearch('缓存一致性需要版本校验和租约恢复'); if (!tokens.includes('缓存') || !tokens.includes('一致性')) process.exit(1);"
          docker run --rm --entrypoint sh focowiki-api:ci -lc 'grep -q nodejieba apps/api/runtime/worker.mjs'

      - name: Validate API image role health
        run: |
          runtime_secret_volume="focowiki-ci-runtime-secrets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "${runtime_secret_volume}" >/dev/null
          trap 'docker volume rm -f "${runtime_secret_volume}" >/dev/null 2>&1 || true' EXIT
          docker run --rm --mount "type=volume,source=${runtime_secret_volume},target=/app/runtime-secrets" --entrypoint node focowiki-api:ci -e "const fs=require('node:fs'); const secret=require('node:crypto').randomBytes(32).toString('base64url'); fs.writeFileSync('/app/runtime-secrets/deployment.key', secret + '\n', { mode: 0o600 });"
          docker run --rm --mount "type=volume,source=${runtime_secret_volume},target=/app/runtime-secrets" --network host --env-file .env.dev.example -e DATABASE_URL="${FOCOWIKI_TEST_DATABASE_URL}" -e REDIS_URL="${REDIS_URL}" focowiki-api:ci node apps/api/runtime/worker.mjs --healthcheck
          docker volume rm "${runtime_secret_volume}" >/dev/null
          trap - EXIT

      - name: Build Admin Docker image
        run: docker build --target admin -t focowiki-admin:ci .

      - name: Validate Admin image runtime configuration
        run: >-
          docker run --rm
          -e ADMIN_API_PROXY_TARGET=http://api:43000
          focowiki-admin:ci nginx -t

      - name: Validate documentation
        env:
          FOCOWIKI_RELEASE_VERSION: 0.0.0-ci
        run: pnpm docs:validate

      - name: Install documentation browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate documentation browser
        run: pnpm docs:validate:browser

      - name: Upload documentation preview
        uses: actions/upload-artifact@v4.6.2
        with:
          name: documentation-preview-${{ github.run_id }}
          path: docs/.vitepress/dist
          retention-days: 7

      - name: Validate local path leaks
        run: pnpm validate:no-local-paths

      - name: Stop S3 health fixture
        if: always()
        run: |
          if [[ -f /tmp/focowiki-s3-health-fixture.pid ]]; then
            kill "$(cat /tmp/focowiki-s3-health-fixture.pid)" || true
          fi

      - name: Stop versioned S3 compatibility fixture
        if: always()
        run: |
          docker rm --force focowiki-versioned-s3-ci >/dev/null 2>&1 || true
          docker image rm minio/minio:RELEASE.2025-09-07T16-13-09Z \
            >/dev/null 2>&1 || true
