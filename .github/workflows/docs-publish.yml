name: Publish Documentation

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  checks: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release version
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "::error::Documentation deployment requires a release tag."
            exit 1
          fi
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Documentation releases require a semantic version tag like v1.2.3."
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Verify main documentation source
        shell: bash
        run: |
          git fetch origin main --prune
          release_commit="$(git rev-list -n 1 "${{ steps.release.outputs.tag }}")"
          docs_commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "${release_commit}" origin/main; then
            echo "::error::Documentation release tags must point to commits already contained in main."
            exit 1
          fi
          if ! git merge-base --is-ancestor "${docs_commit}" origin/main; then
            echo "::error::Documentation source refs must be contained in main."
            exit 1
          fi

      - name: Verify successful CI for release commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "Validate" and .app.slug == "github-actions")] | sort_by(.completed_at) | .[-1].conclusion // ""')"
          if [[ "${conclusion}" != "success" ]]; then
            echo "::error::The release commit must have a successful CI Validate check before documentation publication."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.7.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate documentation
        env:
          FOCOWIKI_RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: pnpm docs:validate

      - name: Install documentation browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate documentation browser
        run: pnpm docs:validate:browser

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy documentation
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
